name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: challengers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d challengers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/challengers_test
      JWT_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-unique-jwt-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run migrate --prefix backend
      - run: npm run migrate:check --prefix backend
      - run: npm test --prefix backend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix backend --audit-level=low
      - run: npm audit --prefix frontend --audit-level=low
      - run: docker build -t governed-research:verify .
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
